</style></head><body><main class="app"><header class="top"><a class="brandHome" href="../../index.html" title="回到第一冊首頁" aria-label="回到第一冊首頁"><div class="brand">🌴 英語點讀百科｜海灘探險</div><div class="sub">Junior English Encyclopedia · Beach Adventure · V2.2</div></a><div class="controls"><span>發音</span><button data-lang="en" class="active">英文</button><button data-lang="zh">中文</button><button data-lang="both">雙語</button><span>語速</span><button data-speed="1" class="active">正常</button><button data-speed="0.75">慢速</button></div></header><div class="layout"><section class="scene" id="scene"><img src="assets/beach_scene.webp" alt="海灘場景，12個點讀物件；單字資訊統一顯示於下方學習區"><div id="hotspots"></div><div id="effect"></div></section><aside class="side"><div class="sidehead">📚 單字列表　12 / 12</div><div class="words" id="words"></div></aside></div><footer class="bottom"><button id="mascotIntro" class="mascotBtn" title="點擊聽波哥大開場白" aria-label="重播波哥大的開場白"><img class="mascot" src="assets/mascot.webp" alt="綠色波哥大鸚鵡"></button><div class="info"><b id="selectedEn">Sun</b>　<span class="cn" id="selectedZh">太陽</span><div class="sentence" id="sentence">The sun is shining brightly.　太陽正明亮地照耀著。</div></div><div class="toolbar"><button id="example">📖 例句</button><button id="quiz">🎮 聽音找圖</button></div><div class="nav"><button id="prev" aria-label="上一個單字">❮</button><strong id="page">1 / 12</strong><button id="next" aria-label="下一個單字">❯</button><button id="home" class="home">⌂ 回首頁</button></div></footer></main><div class="dialog" id="dialog"><div class="modal"><button class="close" id="close">✕</button><h2 id="modalTitle">聽音找圖</h2><div id="modalBody"></div></div></div><script>

let current=0,lang='en',speed=1,quizIndex=0,correct=0;const $=id=>document.getElementById(id);const speech=window.speechSynthesis;function speak(text,locale){if(!('speechSynthesis'in window)){status('此瀏覽器不支援語音播放');return;}return new Promise(resolve=>{const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=speed;u.onend=resolve;u.onerror=resolve;speech.speak(u);});}async function say(en,zh){speech.cancel();if(lang==='en')await speak(en,'en-US');else if(lang==='zh')await speak(zh,'zh-TW');else{await speak(en,'en-US');await speak(zh,'zh-TW');}}function status(s){}function effect(i){const d=data[i],el=document.createElement('span');el.className='pop';el.style.left=d[3]+'%';el.style.top=d[4]+'%';el.textContent=d[8];$('effect').append(el);setTimeout(()=>el.remove(),1250)}function select(i,voice=true){current=(i+12)%12;const d=data[current];$('selectedEn').textContent=d[0];$('selectedZh').textContent=d[1];$('sentence').textContent=d[5]+'　'+d[6];$('page').textContent=(current+1)+' / 12';document.querySelectorAll('.word').forEach((e,j)=>e.classList.toggle('active',j===current));document.querySelectorAll('.hotspot').forEach((e,j)=>e.classList.toggle('selected',j===current));effect(current);if(voice)say(d[0],d[1]);}data.forEach((d,i)=>{const b=document.createElement('button');b.className='hotspot';b.style.left=d[3]+'%';b.style.top=d[4]+'%';b.title=`${i+1}. ${d[0]} ${d[1]}`;b.setAttribute('aria-label',b.title);b.onclick=()=>select(i);$('hotspots').append(b);const w=document.createElement('button');w.className='word';w.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span class="emoji">${d[2]}</span><span class="names"><b>${d[0]}</b><small>${d[1]}</small></span>`;w.onclick=()=>select(i);$('words').append(w)});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));say(data[current][0],data[current][1])});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});$('prev').onclick=()=>select(current-1);$('next').onclick=()=>select(current+1);$('example').onclick=()=>say(data[current][5],data[current][6]);function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('dialog').classList.add('open')}function closeModal(){$('dialog').classList.remove('open');speech.cancel()}$('close').onclick=closeModal;$('dialog').onclick=e=>{if(e.target===$('dialog'))closeModal()};function quiz(){quizIndex=Math.floor(Math.random()*12);const choices=[quizIndex];while(choices.length<4){const i=Math.floor(Math.random()*12);if(!choices.includes(i))choices.push(i)}choices.sort(()=>Math.random()-.5);openModal('🎮 聽音找圖',`<p>聽波哥大說英文，選出正確圖片。</p><button id="hear">🔊 播放題目</button><div class="answers">${choices.map(i=>`<button data-answer="${i}">${data[i][2]}　${data[i][1]}</button>`).join('')}</div><p id="feedback"></p>`);$('hear').onclick=()=>{speech.cancel();speak(data[quizIndex][0],'en-US')};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const yes=Number(b.dataset.answer)===quizIndex;$('feedback').textContent=yes?'🎉 答對了！波哥大為你鼓掌！':'再試一次！你一定可以！';if(yes){select(quizIndex,false);setTimeout(quiz,1100)}});$('hear').click()}$('quiz').onclick=quiz;$('mascotIntro').onclick=playIntro;

function playIntro(){speech.cancel();const u=new SpeechSynthesisUtterance("Wow, what a beautiful beach! Let's explore the seaside together!");u.lang='en-US';u.rate=.9;const vs=speech.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('en-us')&&/male|david|guy/i.test(v.name))||vs.find(v=>v.lang.toLowerCase().startsWith('en-us'))||null;speech.speak(u)}
