找圖</h2><div id="modalBody"></div></div></div><script>
function renderSentence(d){
 const node=document.getElementById('sentence');if(!node)return;
 node.replaceChildren();const en=document.createElement('span');en.className='english-example';
 const word=d[0].trim();const esc=s=>Array.from(s).map(c=>'\\^$.*+?()[]{}|'.includes(c)?'\\'+c:c).join('');
 const forms=[word,word+'s',word+'es'];if(word.endsWith('y'))forms.push(word.slice(0,-1)+'ies');
 const pattern=new RegExp('('+forms.sort((a,b)=>b.length-a.length).map(esc).join('|')+')','ig');
 const sentence=d[5]||'';let last=0;for(const match of sentence.matchAll(pattern)){const i=match.index;if(i>last)en.append(document.createTextNode(sentence.slice(last,i)));const mark=document.createElement('span');mark.className='target-word';mark.textContent=match[0];en.append(mark);last=i+match[0].length;}en.append(document.createTextNode(sentence.slice(last)));
 const zh=document.createElement('span');zh.className='chinese-example';zh.textContent=d[6]||'';
 node.append(en,zh);
}

let current=0,lang='en',speed=1,quizIndex=0,correct=0;const $=id=>document.getElementById(id);const speech=window.speechSynthesis;function speak(text,locale){if(!('speechSynthesis'in window)){status('此瀏覽器不支援語音播放');return;}return new Promise(resolve=>{const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=speed;u.onend=resolve;u.onerror=resolve;speech.speak(u);});}async function say(en,zh){speech.cancel();if(lang==='en')await speak(en,'en-US');else if(lang==='zh')await speak(zh,'zh-TW');else{await speak(en,'en-US');await speak(zh,'zh-TW');}}function status(s){}function effect(i){const d=data[i],el=document.createElement('span');el.className='pop';el.style.left=d[3]+'%';el.style.top=d[4]+'%';el.textContent=d[8];$('effect').append(el);setTimeout(()=>el.remove(),1250)}function select(i,voice=true){current=(i+12)%12;const d=data[current];renderSentence(d);$('page').textContent=(current+1)+' / 12';document.querySelectorAll('.word').forEach((e,j)=>e.classList.toggle('active',j===current));document.querySelectorAll('.hotspot').forEach((e,j)=>e.classList.toggle('selected',j===current));effect(current);if(voice)say(d[0],d[1]);}data.forEach((d,i)=>{const b=document.createElement('button');b.className='hotspot';b.textContent=String(i+1);b.style.left=d[3]+'%';b.style.top=d[4]+'%';b.title=`${i+1}. ${d[0]} ${d[1]}`;b.setAttribute('aria-label',b.title);b.onclick=()=>select(i);$('hotspots').append(b);const w=document.createElement('button');w.className='word';w.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span class="emoji">${d[2]}</span><span class="names"><b>${d[0]}</b><small>${d[1]}</small></span>`;w.onclick=()=>select(i);$('words').append(w)});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));say(data[current][0],data[current][1])});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});$('prev').onclick=()=>select(current-1);$('next').onclick=()=>select(current+1);$('example').onclick=()=>say(data[current][5],data[current][6]);function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('dialog').classList.add('open')}function closeModal(){$('dialog').classList.remove('open');speech.cancel()}$('close').onclick=closeModal;$('dialog').onclick=e=>{if(e.target===$('dialog'))closeModal()};function quiz(){quizIndex=Math.floor(Math.random()*12);const choices=[quizIndex];while(choices.length<4){const i=Math.floor(Math.random()*12);if(!choices.includes(i))choices.push(i)}choices.sort(()=>Math.random()-.5);openModal('🎮 聽音找圖',`<p>聽波哥大說英文，選出正確圖片。</p><button id="hear">🔊 播放題目</button><div class="answers">${choices.map(i=>`<button data-answer="${i}">${data[i][2]}　${data[i][1]}</button>`).join('')}</div><p id="feedback"></p>`);$('hear').onclick=()=>{speech.cancel();speak(data[quizIndex][0],'en-US')};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const yes=Number(b.dataset.answer)===quizIndex;$('feedback').textContent=yes?'🎉 答對了！波哥大為你鼓掌！':'再試一次！你一定可以！';if(yes){select(quizIndex,false);setTimeout(quiz,1100)}});$('hear').click()}$('quiz').onclick=quiz;$('mascotIntro').onclick=playIntro;
